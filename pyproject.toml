[project]
name = "nbrain"
version = "0.1.0"
description = "Standalone second-brain agent: watches your work surface, tracks commitments in an Obsidian vault, and writes a daily brief."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pydantic-ai-slim[anthropic,openai,bedrock,mcp]>=1.0",
  "anthropic>=0.60",
  "boto3>=1.35",
  "typer>=0.15",
  "rich>=13.9",
  "questionary>=2.0",
  "python-frontmatter>=1.1",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "markdown>=3.7",
  "apscheduler>=3.10,<4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "google-api-python-client>=2.150",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  "python-gitlab>=5.0",
  "slack-sdk>=3.33",
  "httpx>=0.27",
  "keyring>=25.0",
  "python-dotenv>=1.0",
  "tzdata>=2024.2",
  "networkx>=3.4",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
  "types-python-dateutil",
]

[project.scripts]
nbrain = "nbrain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nbrain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
